name: Tests

on:
push:
branches:
- main
pull_request:
branches:
- main

jobs:
test:
runs-on: ubuntu-latest
services:
mongodb:
image: mongo:7
ports:
- 27017:27017

steps:
  - name: Checkout repository
    uses: actions/checkout@v5

  - name: Setup Python
    uses: actions/setup-python@v6
    with:
      python-version: "3.14"

  - name: Check environment
    run: |
      python --version
      python -m pip --version
      pwd
      ls -la

  - name: Install dependencies
    run: |
      python -m pip install --upgrade pip
      python -m pip install -r requirements.txt
      python -m pip install pytest pytest-cov pytest-asyncio

  - name: Wait for MongoDB
    run: |
      python - <<'PY'
      import socket
      import time

      for i in range(30):
          try:
              with socket.create_connection(("localhost", 27017), timeout=2):
                  print("MongoDB is ready")
                  break
          except OSError:
              print("Waiting for MongoDB...")
              time.sleep(2)
      else:
          raise RuntimeError("MongoDB did not become ready")
      PY

  - name: Run tests
    env:
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      SECRET_KEY: "test-secret-key"
      DATABASE_NAME: "smart_home_test"
      TEST_DATABASE_NAME: "smart_home_test"
      MONGO_URL: "mongodb://localhost:27017"
      ALGORITHM: "HS256"
    run: |
      python -m pytest -v -s